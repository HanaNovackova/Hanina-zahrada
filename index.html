<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanina zahrada</title>
</head>
<body>
    <div class="method-opacity">
        <img src="images/Mucha/86.png" alt="Birds" class="opacity-img">
        <div class="layer-background">
            <img src="images/Vintage2/2.png" alt="Curtain" class="bg-curtain">
            <img src="images/Vintage2/17.png" alt="Garden" class="bg-garden">
            <img src="images/Vintage2/12.png" alt="Flower" class="bg-flower">
            <img src="images/Mucha/36.png" alt="FlowerFrame" class="bg-frame">
            <img src="images/Vintage2/30.png" alt="Paper1" class="paper-1">
            <img src="images/Vintage2/30.png" alt="Paper2" class="paper-2">
        </div>
        <div class="layer-decorations">
            <img src="images/Vintage2/37.png" alt="Gate1" class="gate-1">
            <img src="images/Mucha/4.png" alt="Beauty1" class="beauty-1 slide-from-top">
            <img src="images/Vintage1/36.png" alt="Logo1" class="logo-1">
            <img src="images/Vintage2/46.png" alt="Tree" class="tree swing-ease">
            <img src="images/Vintage1/28.png" alt="Frame1" class="frame-1 slide-from-left">
            <img src="images/Vintage1/11.png" alt="Shell" class="shell">
        </div>
        <div class="layer-main">
            <img src="images/Mucha/23.png" alt="Wreath" class="wreath rotate1">
            <img src="images/Mucha/59.png" alt="Circle" class="circle rotate1">
            <img src="images/Mucha/57.png" alt="Circle1" class="circle-1 rotate-1">
            <img src="images/Vintage2/48.png" alt="Logo2" class="logo-2">
            <img src="images/Vintage2/4.png" alt="Butterfly" class="butterfly">
            <img src="images/Vintage1/21.png" alt="Paper3" class="paper-3">
        </div>
        <div class="layer-foreground">
            <img src="images/Vintage1/40.png" alt="Ribbon" class="ribbon">
            <img src="images/Mucha/17.png" alt="Beauty2" class="beauty-2 slide-from-bottom">
            <img src="images/Mucha/9.png" alt="Beauty3" class="beauty-3 slide-from-left">
            <img src="images/Mucha/42.png" alt="Frame2" class="frame-2">
            <img src="images/Vintage1/51.png" alt="Key" class="key float-up-down">
            <img src="images/Vintage1/43.png" alt="Fan" class="fan">
        </div>
        <div class="layer-floating">
            <img src="images/Vintage2/6.png" alt="Logo3" class="logo-3">
            <img src="images/Vintage1/25.png" alt="Bird1" class="bird-1 float-graceful">
            <img src="images/Vintage2/15.png" alt="Bird2" class="bird-2 float-graceful">
            <img src="images/Vintage2/51.png" alt="HandFlower" class="hand-flower">
            <img src="images/Vintage1/45.png" alt="HandPearl" class="hand-pearl float-up-down">
            <img src="images/Mucha/25.png" alt="Flower1" class="flower-1 swing-ease">
        </div>
        <img src="images/Vintage1/35.png" id="Logo4" class="logo-4" alt="ControlButton">
        <a href="https://hananovackova.github.io/About-Me/">
            <img src="images/Vintage1/30.png" alt="Logo5" class="logo-5">
        </a>
        <p class="maintitle">Hanina Zahrada</p>
        <p class="subtitle">Vítej v mé zahradě.</p>
        <a href="/blog/" class="custom-btn">otevřete bránu</a>
        <p class="littletext">@Hana Nováčková</p>
    </div>
    <script>
        const controlBtn = document.getElementById('Logo4');
        const animatedItems = document.querySelectorAll('.wreath, .circle, .circle-1, .tree, .key, .bird-1, .bird-2, .hand-pearl, .flower-1');
        let isPlaying = true;
        controlBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            animatedItems.forEach(item => {
                item.style.animationPlayState = isPlaying ? 'running' : 'paused';
            });
        });
    </script>
</body>
</html>
